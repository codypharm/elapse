<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#23262a">
<title>{{product}} · {{merchant}}</title>
<link rel="stylesheet" href="/northwind.css">
</head>
<body>
<main class="term">
  <header class="id">
    <a class="mark" href="/">North<b>wind</b></a>
    <span class="loc">Field terminal<br>Unit 07</span>
  </header>

  <h1>{{product}}</h1>
  <p class="sub">Write code, run it on real serverless, pay for the seconds your session is open.</p>

  <div class="label"><span class="k">Rate</span><span class="v">{{price}}</span></div>

  <p class="note">There is no start button. Your first run opens the session, and it closes itself when you stop working.</p>
  <a class="open" href="/console">Open console &rarr;</a>

  <footer class="tag">{{merchant}} · demo merchant</footer>
</main>
</body>
</html>
