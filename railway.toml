# Railway reads this from the repo root. Both services (api, worker) build the same image;
# the worker service sets its start command to `bun src/worker/index.ts` in the Railway UI.
[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
healthcheckPath = "/v1/status"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
